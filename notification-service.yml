server:
  port: 8084

spring:
  datasource:
    url: jdbc:mysql://payflow-mysql:3306/payflow_notification
    username: root        
    password: mysql    
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update    
    show-sql: true        
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  kafka:
    bootstrap-servers: payflow-kafka:9092
    
    properties:
      spring.json.trusted.packages: "*"

    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.value.default.type: com.payflow.notification.dto.MoneyTransferredEvent
        spring.json.add.type.headers: false

eureka:
  client:
    service-url:
      defaultZone: http://payflow-eureka:8761/eureka/
