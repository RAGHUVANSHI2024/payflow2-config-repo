server:
  port: 8084

spring:
  kafka:
    bootstrap-servers: payflow-kafka:9092

    producer:
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.payflow.notification.dto.MoneyTransferredEvent
        
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.payflow.notification.dto.MoneyTransferredEvent

eureka:
  client:
    service-url:
      defaultZone: http://payflow-eureka:8761/eureka
