server:
  port: 8081

spring:
  resilience4j:
    circuitbreaker:
      instances:
        walletService:
          sliding-window-size: 5
          minimum-number-of-calls: 3
          failure-rate-threshold: 50
          wait-duration-in-open-state: 10s


  kafka:
    bootstrap-servers: payflow-kafka:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
        
  datasource:
    url: jdbc:mysql://payflow-mysql:3306/payflow_auth
    username: root
    password: mysql
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://payflow-eureka:8761/eureka
      
management:
  endpoints:
    web:
      exposure:
        include: health, circuitbreakers
