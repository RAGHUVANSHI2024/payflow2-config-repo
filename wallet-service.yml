server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/payflow_wallet
    username: root
    password: mysql
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

    
